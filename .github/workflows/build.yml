name: Build APK
on: workflow_dispatch
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Create Android Project
        run: |
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/java/com/example/strictblock
          mkdir -p app/src/main/res/values

          # Create settings.gradle
          cat > settings.gradle <<'EOF'
          rootProject.name = "StrictBlock"
          include ':app'
          EOF

          # Create build.gradle (Project level)
          cat > build.gradle <<'EOF'
          buildscript {
              repositories { google() }
              dependencies { classpath 'com.android.tools.build:gradle:8.2.2' }
          }
          allprojects { repositories { google() } }
          EOF

          # Create app/build.gradle
          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace "com.example.strictblock"
              compileSdk 34
              defaultConfig {
                  applicationId "com.example.strictblock"
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
          }
          EOF

          # Create AndroidManifest.xml
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://github.com">
              <application android:label="الحظر الصارم" android:supportsRtl="true">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <service android:name=".BlockService" android:exported="false" android:label="الحظر الصارم" android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService"/>
                      </intent-filter>
                      <meta-data android:name="android.accessibilityservice" android:resource="@xml/accessibility_config"/>
                  </service>
              </application>
          </manifest>
          EOF

          # Create BlockService.kt
          cat > app/src/main/java/com/example/strictblock/BlockService.kt <<'EOF'
          package com.example.strictblock
          import android.accessibilityservice.AccessibilityService
          import android.view.accessibility.AccessibilityEvent
          class BlockService : AccessibilityService() {
              override fun onAccessibilityEvent(e: AccessibilityEvent) {}
              override fun onInterrupt() {}
          }
          EOF

          # Create MainActivity.kt
          cat > app/src/main/java/com/example/strictblock/MainActivity.kt <<'EOF'
          package com.example.strictblock
          import android.app.Activity
          import android.os.Bundle
          import android.widget.TextView
          class MainActivity : Activity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val tv = TextView(this).apply { text = "تطبيق الحظر الصارم يعمل بنجاح!" }
                  setContentView(tv)
              }
          }
          EOF

          # Create strings.xml
          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources><string name="desc">خدمة الحظر الصارم</string></resources>
          EOF

          # Create accessibility_config.xml
          cat > app/src/main/res/xml/accessibility_config.xml <<'EOF'
          <accessibility-service xmlns:android="http://github.com"
              android:accessibilityEventTypes="typeWindowStateChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:description="@string/desc" />
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build APK with Gradle
        run: gradle assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StrictBlock-APK
          path: app/build/outputs/apk/debug/*.apk

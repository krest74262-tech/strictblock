name: Build APK
on: workflow_dispatch
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Create project structures
        run: |
          mkdir -p StrictBlock/app/src/main/res/xml
          mkdir -p StrictBlock/app/src/main/java/com/example/strictblock
          mkdir -p StrictBlock/app/src/main/res/values

          cat > StrictBlock/settings.gradle.kts <<'EOF'
          rootProject.name = "StrictBlock"
          include(":app")
          EOF

          cat > StrictBlock/app/build.gradle.kts <<'EOF'
          plugins { id("com.android.application"); id("org.jetbrains.kotlin.android") }
          android {
              namespace = "com.example.strictblock"
              compileSdk = 34
              defaultConfig { applicationId = "com.example.strictblock"; minSdk = 26; targetSdk = 34; versionCode = 1; versionName = "1.0" }
              compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = "17" }
          }
          EOF

          cat > StrictBlock/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://github.com">
              <application android:label="الحظر الصارم" android:supportsRtl="true" android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <service android:name=".BlockService" android:exported="false" android:label="الحظر الصارم" android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService"/>
                      </intent-filter>
                      <meta-data android:name="android.accessibilityservice" android:resource="@xml/accessibility_config"/>
                  </service>
              </application>
          </manifest>
          EOF

          cat > StrictBlock/app/src/main/java/com/example/strictblock/BlockService.kt <<'EOF'
          package com.example.strictblock
          import android.accessibilityservice.AccessibilityService
          import android.view.accessibility.AccessibilityEvent
          class BlockService : AccessibilityService() {
              override fun onAccessibilityEvent(e: AccessibilityEvent) {}
              override fun onInterrupt() {}
          }
          EOF

          cat > StrictBlock/app/src/main/java/com/example/strictblock/MainActivity.kt <<'EOF'
          package com.example.strictblock
          import android.app.Activity
          import android.os.Bundle
          import android.widget.TextView
          class MainActivity : Activity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val tv = TextView(this).apply { text = "تطبيق الحظر الصارم يعمل بنجاح!" }
                  setContentView(tv)
              }
          }
          EOF

          cat > StrictBlock/app/src/main/res/values/strings.xml <<'EOF'
          <resources><string name="desc">خدمة الحظر الصارم</string></resources>
          EOF

          cat > StrictBlock/app/src/main/res/xml/accessibility_config.xml <<'EOF'
          <accessibility-service xmlns:android="http://github.com"
              android:accessibilityEventTypes="typeWindowStateChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:description="@string/desc" />
          EOF

      - name: Build APK
        run: |
          cd StrictBlock
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StrictBlock-APK
          path: StrictBlock/app/build/outputs/apk/debug/*.apk
